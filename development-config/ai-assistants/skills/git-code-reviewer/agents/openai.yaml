interface:
  display_name: "Git Code Reviewer"
  short_description: "面向 Python 服务端与通用后端的高信号代码审查"
  default_prompt: "Use $git-code-reviewer to review this Python backend or service change and report concrete findings with severity, file references, confirmed evidence, unverified assumptions, and residual risks; if scope depends on a base branch, state the exact ref and whether fetch was executed or skipped."
