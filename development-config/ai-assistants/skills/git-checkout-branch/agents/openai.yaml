interface:
  display_name: "Git Checkout Branch"
  short_description: "先确认远程基础分支，再基于当前 diff 推断分支名"
  default_prompt: "Use $git-checkout-branch to first ask me which remote base branch to use, resolve it to a remote-tracking ref by default, inspect the current branch and diff, recommend one branch name from the dominant change, and switch only after I confirm."
