interface:
  display_name: "Git Restack From Base"
  short_description: "输入基础分支后按对应远程跟踪分支解析，确认后再重切分支并迁移提交"
  default_prompt: "Use $git-restack-from-base to first ask in natural language which base branch to use, resolve an unqualified branch name to the corresponding remote-tracking ref by default, fetch when freshness matters, then show the provided base branch, the resolved base ref, and the current branch for confirmation before recreating the current branch."
