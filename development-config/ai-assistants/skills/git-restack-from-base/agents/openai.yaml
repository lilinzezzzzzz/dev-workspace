interface:
  display_name: "Git Restack From Base"
  short_description: "输入基础分支后按对应远程跟踪分支解析，确认后再重切分支并迁移提交"
  default_prompt: "Use $git-restack-from-base to first ask in natural language which base branch to use, treat unqualified names such as dev as remote branches by default, resolve them to origin/<branch> or the only configured remote, fetch the specific remote base, resolve `scripts/restack_from_base.py` relative to the loaded skill directory instead of the current working directory, and show the provided base branch, the resolved base ref, and the current branch for confirmation before recreating the current branch. Do not fall back to a same-name local branch unless I explicitly ask for a local ref, and do not fall back to a manual restack until that canonical script path has been checked. After a successful restack and verification, ask whether to delete the source branch locally and remotely, show the exact refs that would be deleted, and run the deletion only after explicit confirmation."
