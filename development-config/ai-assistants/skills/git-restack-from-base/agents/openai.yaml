interface:
  display_name: "Git Restack From Base"
  short_description: "输入基础分支后按对应远程跟踪分支解析，确认后再重切分支并迁移提交"
  default_prompt: "Use $git-restack-from-base to first ask in natural language which base branch to use, follow the shared remote-base rule, resolve `scripts/restack_from_base.py` relative to the loaded skill directory, and show the provided base branch, resolved base ref, base freshness, and current branch for confirmation before recreating the current branch. After a successful restack and verification, ask whether to delete the source branch locally and remotely, show the exact refs that would be deleted, and run deletion only after explicit confirmation."
