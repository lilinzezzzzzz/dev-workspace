"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

format = """
$directory$cmd_duration $character"""

right_format = """
$git_branch$git_status"""

[username]
style_user = "bold white"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = true
style = "bold cyan"
format = "[@$hostname]($style)"

[directory]
style = "bold cyan"
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style)"
read_only = " [ro]"
read_only_style = "bold red"

[git_branch]
style = "bold blue"
format = "[$branch]($style)"
truncation_length = 24
truncation_symbol = "..."

[git_status]
style = "bold yellow"
format = "[$all_status$ahead_behind]($style)"
conflicted = "="
ahead = ">${count}"
behind = "<${count}"
diverged = "<>${ahead_count}/${behind_count}"
up_to_date = ""
untracked = ""
stashed = "$"
modified = "!"
staged = "+"
renamed = "R"
deleted = "D"
typechanged = "T"

[python]
style = "bold green"
format = " [py $version]($style)"

[nodejs]
style = "bold green"
format = " [node $version]($style)"

[golang]
style = "bold cyan"
format = " [go $version]($style)"

[rust]
style = "bold yellow"
format = " [rs $version]($style)"

[docker_context]
style = "bold magenta"
format = " [docker $context]($style)"

[cmd_duration]
min_time = 2000
style = "bold white"
format = " [took $duration]($style)"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold cyan)"
