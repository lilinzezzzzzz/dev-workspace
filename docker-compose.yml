services:
  python-workspace:
    profiles: ["python-workspace"]  # 仅 Windows 环境需要启动，通过 --profile python-workspace 激活
    image: python-workspace:latest
    container_name: python-workspace
    build:
      context: . # 上下文路径为当前目录, 如果使用dockerfile构建，则image是构建的镜像名
      dockerfile: Dockerfile # 指定 Dockerfile 的相对路径
    environment:
      TZ: "UTC" # 设置时区为 UTC
      PYTHON_WORKSPACE_ROOT_PASSWORD: "${PYTHON_WORKSPACE_ROOT_PASSWORD:?PYTHON_WORKSPACE_ROOT_PASSWORD must be set}"
    ports:
      - "10022:22" # 映射主机的 10222 端口到容器的 22 端口,用于 SSH 连接
      - "8000-8099:8000-8099"
    volumes:
      # 挂载 SSH 密钥（仅挂载必要文件）
      - "./ssh-keys/id_rsa:/tmp/host-ssh/id_rsa:ro"
      - "./ssh-keys/id_rsa.pub:/tmp/host-ssh/id_rsa.pub:ro"
    privileged: true # 开启特权模式
    stdin_open: true # 保持容器的标准输入打开
    tty: true # 分配伪终端
    networks:
      - common-network # 使用共享网络

  redis:
    image: "redis:6.0.16"
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      TZ: "UTC"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - "./infras/redis/data:/data"
      - "./infras/redis/redis.conf:/etc/redis/redis.conf"
    networks:
      - common-network

  mysql:
    image: "mysql:8.0.30"
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      TZ: "UTC"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}"
      # 允许本机及 common-network 中的容器使用 root 连接本地开发 MySQL。
      MYSQL_ROOT_HOST: "%"
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]
    volumes:
      - "./infras/mysql/data:/var/lib/mysql"
      - "./infras/mysql/conf/my.cnf:/etc/mysql/conf.d/my.cnf"
      - "./infras/mysql/logs:/var/log/mysql"
    networks:
      - common-network

  postgres:
    profiles: ["jsontype-postgres"]
    image: "postgres:17"
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      TZ: "UTC"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    volumes:
      - "./infras/postgres/data:/var/lib/postgresql/data"
    networks:
      - common-network

  oracle:
    profiles: ["jsontype-oracle"]
    image: "container-registry.oracle.com/database/free:latest-lite"
    container_name: oracle
    ports:
      - "1521:1521"
    environment:
      TZ: "UTC"
      ORACLE_PWD: "${ORACLE_PWD:?ORACLE_PWD must be set}"
    volumes:
      - "oracle-oradata:/opt/oracle/oradata"
    shm_size: "1gb"
    networks:
      - common-network

  clickhouse:
    profiles: ["clickhouse"]
    image: "clickhouse/clickhouse-server:25.8"
    container_name: clickhouse
    ports:
      - "8123:8123" # HTTP 接口
      - "9000:9000" # Native TCP 接口
    environment:
      TZ: "UTC"
      CLICKHOUSE_DB: "ai-service"
      CLICKHOUSE_USER: "clickhouse"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - "./infras/clickhouse/data:/var/lib/clickhouse"
      - "./infras/clickhouse/logs:/var/log/clickhouse-server"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", 'clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - common-network

  otel-collector:
    profiles: ["clickhouse"]
    image: "otel/opentelemetry-collector-contrib:0.156.0"
    container_name: otel-collector
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      OTEL_CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}"
    ports:
      - "4318:4318" # OTLP/HTTP，由安全组限制来源 IP
      - "127.0.0.1:13133:13133" # Collector 健康检查
    volumes:
      - "./infras/opentelemetry/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    restart: unless-stopped
    networks:
      - common-network

  milvus-etcd:
    image: "quay.io/coreos/etcd:v3.5.18"
    container_name: milvus-etcd
    environment:
      TZ: "UTC"
    command: >
      etcd
      --advertise-client-urls=http://milvus-etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - "./infras/milvus/etcd:/etcd"
    networks:
      - common-network

  milvus-minio:
    image: "minio/minio:RELEASE.2025-02-18T16-25-55Z"
    container_name: milvus-minio
    environment:
      TZ: "UTC"
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}"
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - "./infras/milvus/minio:/minio_data"
    networks:
      - common-network

  milvus-standalone:
    image: "milvusdb/milvus:v2.6.7"
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      TZ: "UTC"
      ETCD_ENDPOINTS: "milvus-etcd:2379"
      MINIO_ADDRESS: "milvus-minio:9000"
      MINIO_ACCESS_KEY_ID: "minioadmin"
      MINIO_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}"
    volumes:
      - "./infras/milvus/standalone:/var/lib/milvus"
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - milvus-etcd
      - milvus-minio
    networks:
      - common-network

  attu:
    image: "zilliz/attu:v2.6.3"
    container_name: attu
    environment:
      TZ: "UTC"
      MILVUS_URL: "milvus-standalone:19530"
    ports:
      - "18000:3000" # 避免与 python-workspace profile 的 8000-8099 端口段冲突
    depends_on:
      - milvus-standalone
    networks:
      - common-network

volumes:
  oracle-oradata:
    name: oracle-oradata

# 定义共享网络
networks:
  common-network:
    name: common-network
    driver: bridge
