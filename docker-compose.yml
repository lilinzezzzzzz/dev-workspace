  redis:
    image: "redis:6.0.16"
    container_name: redis-server
    ports:
      - "6379:6379"
    environment:
      TZ: "UTC"
    command: redis-server --requirepass 123456
    volumes:
      - "./redis/data:/data"
      - "./redis-6.0.16/redis.conf:/etc/redis/redis.conf"
    networks:
      - common-network

# 定义共享网络
networks:
  common-network:
    name: common-network
    driver: bridge
