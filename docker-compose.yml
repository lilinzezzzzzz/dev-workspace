services:
  dev-workspace:
    profiles: ["workspace"]  # 仅 Windows 环境需要启动，通过 --profile workspace 激活
    image: dev-workspace:latest
    container_name: dev-workspace
    build:
      context: . # 上下文路径为当前目录, 如果使用dockerfile构建，则image是构建的镜像名
      dockerfile: Dockerfile # 指定 Dockerfile 的相对路径
    environment:
      TZ: "UTC" # 设置时区为 UTC
    ports:
      - "10022:22" # 映射主机的 10222 端口到容器的 22 端口,用于 SSH 连接
      - "8000-8099:8000-8099"
    volumes:
      # 挂载 SSH 密钥（仅挂载必要文件）
      - "./ssh-keys/id_rsa:/tmp/host-ssh/id_rsa:ro"
      - "./ssh-keys/id_rsa.pub:/tmp/host-ssh/id_rsa.pub:ro"
    privileged: true # 开启特权模式
    stdin_open: true # 保持容器的标准输入打开
    tty: true # 分配伪终端
    networks:
      - common-network # 使用共享网络

  redis:
    image: "redis:6.0.16"
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      TZ: "UTC"
    command: redis-server --requirepass 123456
    volumes:
      - "./infras/redis/data:/data"
      - "./infras/redis/redis.conf:/etc/redis/redis.conf"
    networks:
      - common-network

  mysql:
    image: "mysql:8.0.30"
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      TZ: "UTC"
      MYSQL_ROOT_PASSWORD: "123456"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - "./infras/mysql/data:/var/lib/mysql"
      - "./infras/mysql/conf/my.cnf:/etc/mysql/conf.d/my.cnf"
      - "./infras/mysql/logs:/var/log/mysql"
    networks:
      - common-network

  milvus-etcd:
    image: "quay.io/coreos/etcd:v3.5.18"
    container_name: milvus-etcd
    environment:
      TZ: "UTC"
    command: >
      etcd
      --advertise-client-urls=http://milvus-etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - "./infras/milvus/etcd:/etcd"
    networks:
      - common-network

  milvus-minio:
    image: "minio/minio:RELEASE.2025-02-18T16-25-55Z"
    container_name: milvus-minio
    environment:
      TZ: "UTC"
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - "./infras/milvus/minio:/minio_data"
    networks:
      - common-network

  milvus-standalone:
    image: "milvusdb/milvus:v2.6.7"
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      TZ: "UTC"
      ETCD_ENDPOINTS: "milvus-etcd:2379"
      MINIO_ADDRESS: "milvus-minio:9000"
    volumes:
      - "./infras/milvus/standalone:/var/lib/milvus"
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - milvus-etcd
      - milvus-minio
    networks:
      - common-network

  attu:
    image: "zilliz/attu:v2.6.3"
    container_name: attu
    environment:
      TZ: "UTC"
      MILVUS_URL: "milvus-standalone:19530"
    ports:
      - "18000:3000" # 避免与 workspace profile 的 8000-8099 端口段冲突
    depends_on:
      - milvus-standalone
    networks:
      - common-network

# 定义共享网络
networks:
  common-network:
    name: common-network
    driver: bridge
