extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s
    database: ai-service
    username: clickhouse
    password: ${env:OTEL_CLICKHOUSE_PASSWORD}
    traces_table_name: otel_traces
    create_schema: true
    async_insert: true
    compress: lz4
    timeout: 5s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000
      batch:
        min_size: 5000
        max_size: 10000
        flush_timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [clickhouse]
  telemetry:
    logs:
      level: info
